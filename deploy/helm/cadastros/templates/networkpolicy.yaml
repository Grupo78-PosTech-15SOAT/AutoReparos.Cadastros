{{- if .Values.networkPolicy.enabled }}
# O Cadastros expõe rotas /internal (autenticação do cliente pela AuthLambda) protegidas por X-Chave-Interna.
# A NetworkPolicy fecha o acesso aos pods ao necessário: o próprio namespace, os namespaces dos serviços que chamam
# o Cadastros, os controladores de entrada e os CIDRs das sub-redes privadas (ALB interno e Lambda).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "servico.nome" . }}-ingress
  labels:
    {{- include "servico.rotulos" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "servico.seletor" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        {{- range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
        {{- range .Values.networkPolicy.allowedCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
